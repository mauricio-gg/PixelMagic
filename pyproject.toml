[project]
name = "pixelmagic"
version = "0.1.0"
description = "Turn a text prompt into game-ready pixel art"
requires-python = ">=3.12"
dependencies = [
    # The MCP server (spec locked decision 2). `mcp` 2.x requires pydantic 2.12,
    # which is why the floor above is not 2.7 any more; it also brings starlette,
    # uvicorn and python-multipart, which the web page already declares for itself.
    "pydantic>=2.12",
    "pillow>=13.0.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "typer>=0.12",
    # The web page (spec locked decision 2): FastAPI serving server-rendered HTML.
    # jinja2 is what autoescapes the prompts, feedback and service-invented names
    # that go onto every page; python-multipart is what FastAPI needs to read an
    # HTML form at all; uvicorn is what runs it, bound to localhost only.
    "fastapi>=0.141",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52",
    "mcp>=2.1,<3",
    # The OS keychain (macOS Keychain, Secret Service, Windows Credential
    # Locker): where a pasted API key is kept, so no key is ever in a project folder.
    "keyring>=25",
]

[project.scripts]
pixelmagic = "pixelmagic.cli:app"

# Installed only when a real service is used: `uv sync --extra gemini`. They
# are extras rather than dependencies because the offline pipeline — which is
# every test and every `--service fake` run — needs neither.
[project.optional-dependencies]
gemini = [
    "google-genai>=2.22,<3",
]
openai = [
    "openai>=3.8,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling ships every file inside the package directory, so prompts/*.md and
# aseprite/*.lua travel with the wheel without extra configuration.
[tool.hatch.build.targets.wheel]
packages = ["src/pixelmagic"]

[dependency-groups]
dev = [
    "anyio>=4.9",
    "httpx2>=2.5",
    "pytest>=8",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Somebody else's code, copied unchanged (segmenter/vendor/NOTICE).
extend-exclude = ["segmenter/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: spends a real subscription, credits or money — skipped unless its PIXELMAGIC_LIVE_* env var is set, and always sees the real ~/.codex rather than the offline fixture's scratch one",
]
